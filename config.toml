[defaults]
expense_account = "Expenses:Other"
income_account = "Income:Other"
suspense_account = "Assets:Unknown"
cashback_income_account = "Income:Rebate:Bank"
aa_account = "Assets:Receivables:Other"
reimburse_account = "Assets:Receivables:Employer"
default_share_account = "Assets:Receivables:Partner"
discount_income_account = "Income:Other"
alipay_balance_account = "Assets:Current:Alipay:Balance"
alipay_yuebao_account = "Assets:Current:Alipay:YuEBao"
alipay_huabei_account = "Liabilities:Credit:Alipay:Huabei"
wechat_balance_account = "Assets:Current:WeChat:Balance"
wechat_lqt_account = "Assets:Current:WeChat:LQT"

[[account_rules]]
pattern = "工商银行信用卡\\(1234\\)|ICBC信用卡\\(1234\\)"
account = "Liabilities:Credit:Bank:CNYCard1234"

[[account_rules]]
pattern = "工商银行信用卡\\(5678\\)|ICBC信用卡\\(5678\\)"
account = "Liabilities:Credit:Bank:FXCard5678"

[[account_rules]]
pattern = "工商银行储蓄卡\\(1234\\)"
account = "Assets:Current:Bank:Checking1234"

[[expense_rules]]
pattern = "咖啡|奶茶|饮品|甜汤|饮品店|示例饮品品牌"
account = "Expenses:Food:Drink"

[[expense_rules]]
pattern = "便利店|超市|杂货|生鲜|便利杂货|烘焙"
account = "Expenses:Grocery"

[[expense_rules]]
pattern = "餐饮|外卖|团购|餐厅|饭店|汉堡|寿司|牛肉粉|越南粉|比萨|披萨|示例外卖平台"
account = "Expenses:Food:Dining"

[[expense_rules]]
pattern = "单位食堂|校园卡|一卡通充值|大学"
account = "Expenses:Food:Workplace"

[[expense_rules]]
pattern = "轨道交通|地铁|公交"
account = "Expenses:Traffic:Urban:Public"

[[expense_rules]]
pattern = "医院|药"
account = "Expenses:Medical"

[[expense_rules]]
pattern = "电影|演出|票务|视频平台"
account = "Expenses:Entertainment"

[[expense_rules]]
pattern = "电力|国网|快递|速运"
account = "Expenses:Utilities"

[[income_rules]]
pattern = "余额宝.*收益发放"
account = "Income:Current:Alipay:YuEBao"

[[income_rules]]
pattern = "发票有奖"
account = "Income:Other"

[[income_rules]]
pattern = "奖金"
account = "Income:Prize"

[[merchant_alias_rules]]
pattern = "示例公司主体名"
aliases = ["示例品牌名", "示例门店名"]

[[credit_card_cashback_rules]]
merchant_pattern = "Visa|Rewards|Rebate"

[funds]
default_account = "Assets:Invest:Alipay:Fund"
default_income_account = "Income:Invest:Alipay:Fund"
commission_account = "Expenses:Invest:Commissions"
default_settlement_days = 1
share_precision = 2

[funds.accounts]
fund = "Assets:Invest:Alipay:Fund"
au9999 = "Assets:Invest:Alipay:AU9999"

[funds.income_accounts]
fund = "Income:Invest:Alipay:Fund"
au9999 = "Income:Invest:Alipay:Fund"

[[funds.settlement_rules]]
pattern = "QDII|纳斯达克"
settlement_days = 2

[manual_review]
patterns = [
  "财付通\\(银联云闪付\\)",
  "AA",
]
